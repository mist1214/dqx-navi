        const CUSTOM_TASK_TYPES = ["daily", "weekly", "biweeklyA", "biweeklyB", "monthly", "monthly10", "manual"];

        const isTaskEnabledFor = (def, charId, isNewChar) => {
            if (!def) return false;
            if (def.enabledFor === "all") {
                if (isNewChar && def.applyToNewChars === false) return false;
                return true;
            }
            return Array.isArray(def.enabledFor) && def.enabledFor.indexOf(charId) >= 0;

            customs.forEach(def => {
                if (def && def.type !== "manual" && CUSTOM_TASK_TYPES.indexOf(def.type) >= 0 && types.indexOf(def.type) < 0) types.push(def.type);

        const normalizeCustomData = (dataObj) => {
            if (!dataObj || typeof dataObj !== "object") return dataObj;
            if (!Array.isArray(dataObj.customTasks)) dataObj.customTasks = [];
            const charIds = (dataObj.characters || []).map(c => c.id);
            const seen = {};
            dataObj.customTasks = dataObj.customTasks.filter(def => {
                if (!def || typeof def !== "object") return false;
                if (!def.id || !def.name || CUSTOM_TASK_TYPES.indexOf(def.type) < 0) return false;
                if (seen[def.id]) return false;
                seen[def.id] = true;
                // ライブラリ由来の定義は、ライブラリ側の最新情報（名称・種別・説明文）に追随させる（enabledFor 等のユーザー設定は保持する）
                if (def.origin === "library") {
                    const lib = LIBRARY_TASKS.find(l => l.id === def.id);
                    if (lib) { def.name = lib.name; def.type = lib.type; def.ver = lib.ver; def.place = lib.place; def.desc = lib.desc; }
                }
                if (def.enabledFor !== "all") {
                    const arr = Array.isArray(def.enabledFor) ? def.enabledFor : [];
                    def.enabledFor = arr.filter(id => charIds.indexOf(id) >= 0);
                }
                return true;
            });
            return dataObj;
        };

        // ▼ カスタマイズ機能：一括追加・一括削除（純粋関数。入力は書き換えず deep copy した新しい data を返す） ▼
        // 一括追加：ライブラリ全件に、単品の applyScope と同じ意味の反映範囲をまとめて適用する。
        // mode "all"    → 全件 enabledFor:"all" かつ applyToNewChars:true
        // mode "active" → 各定義に現在キャラを追加（既に "all" の定義は "all" のまま）

        const bulkAddLibrary = (dataObj, mode, activeCharId, selectedIds) => {
            const data = JSON.parse(JSON.stringify(dataObj));
            if (!Array.isArray(data.customTasks)) data.customTasks = [];
            const charIds = (data.characters || []).map(c => c.id);
            const sel = (Array.isArray(selectedIds) ? selectedIds : []).filter(id => charIds.indexOf(id) >= 0);

                let def = data.customTasks.find(d => d.id === lib.id);
                if (!def) {
                    def = { id: lib.id, name: lib.name, type: lib.type, ver: lib.ver, place: lib.place, desc: lib.desc, origin: "library", enabledFor: [], applyToNewChars: true };
                    data.customTasks.push(def);
                }
                if (mode === "all") {
                    def.enabledFor = "all";

                } else if (mode === "active") {
                    if (def.enabledFor !== "all") {
                        const ids = Array.isArray(def.enabledFor) ? def.enabledFor.slice() : [];
                        if (ids.indexOf(activeCharId) < 0) ids.push(activeCharId);
                        def.enabledFor = ids;
                        def.applyToNewChars = false;
                    }
                } else { // select
                    def.enabledFor = sel.slice();
                    def.applyToNewChars = false;

                if (Array.isArray(def.enabledFor) && def.enabledFor.length === 0) {

        //   enabledFor "all" は対象外キャラの配列に変換し applyToNewChars:false、配列は対象キャラを除外。

        // mode "all"（全キャラから完全に削除）→ 全定義を削除し、deleteCustomTask と同じ後始末（全キャラの review.items / uncompleted から除去）。
        const bulkRemoveContent = (dataObj, mode, activeCharId, selectedIds) => {
            const data = JSON.parse(JSON.stringify(dataObj));

                const removedIds = data.customTasks.map(d => d.id);

                if (def.enabledFor === "all") {
                    def.enabledFor = charIds.filter(id => targets.indexOf(id) < 0);

                } else if (Array.isArray(def.enabledFor)) {
                    def.enabledFor = def.enabledFor.filter(id => targets.indexOf(id) < 0);

        const sectionColumnCountForWidth = (width) => (width >= 1280 ? 3 : width >= 768 ? 2 : 1);

        // items: [{ type, height }]（元の表示順）。高さ降順にソートし、現在の合計高さが最小の列へ順に割り当てる（貪欲法、同点は左の列を優先）。
        // 列内は元の表示順に並べ直し、列の並び自体も「列内で最も早い元の順序」で並べ替える（高さ合計は変わらないのでバランスは維持される）。戻り値: 列ごとの type 配列。
        const distributeSections = (items, columnCount) => {
            const cols = Math.max(1, Math.floor(columnCount) || 1);
            const columns = [];
            const totals = [];
            for (let i = 0; i < cols; i++) { columns.push([]); totals.push(0); }
            const indexed = (items || []).map((item, idx) => ({ type: item.type, height: Math.max(0, (item && item.height) || 0), order: idx }));
            const sorted = indexed.slice().sort((a, b) => (b.height - a.height) || (a.order - b.order));
            sorted.forEach(item => {
                let target = 0;
                for (let i = 1; i < cols; i++) if (totals[i] < totals[target]) target = i;
                columns[target].push(item);
                totals[target] += item.height;
            });
            const arranged = columns.map(col => col.slice().sort((a, b) => a.order - b.order));
            // 列の並びは「その列で最も早い元のセクション順」で決める（日課のある列が左に来る等、左から自然に読める並びにする）。空列は最後。
            arranged.sort((a, b) => {
                const aMin = a.length ? a[0].order : Number.POSITIVE_INFINITY;
                const bMin = b.length ? b[0].order : Number.POSITIVE_INFINITY;
                return aMin - bMin;
            });
            return arranged.map(col => col.map(item => item.type));
        };

        // ▼ 自動リセット＆振り返りナビ用ヘルパー ▼
        const RESET_TYPES = ["daily", "weekly", "biweeklyA", "biweeklyB"]; // 固定表示用（後方互換）。実際の自動リセット対象は getAutoResetTypes(data) で動的に求める
        const TYPE_LABELS = { daily: "日課", weekly: "週課", biweeklyA: "隔週（1日・15日）", biweeklyB: "隔週（10日・25日）", monthly: "月課", monthly10: "月課（10日）", manual: "不定期" };

        // type ごとに「now 以前で最も新しい 6:00 のリセット時刻」を返す
        const mostRecentReset = (type, now) => {
            const six = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 0, 0, 0);
            if (type === "daily") {
                const d = new Date(six);
                if (now < d) d.setDate(d.getDate() - 1);
                return d;
            }
            if (type === "weekly") {
                const d = new Date(six);
                if (now < d) d.setDate(d.getDate() - 1);
                d.setDate(d.getDate() - d.getDay()); // 直近の日曜 6:00
                return d;
            }
            if (type === "monthly") {
                const d = new Date(now.getFullYear(), now.getMonth(), 1, 6, 0, 0, 0);
                if (now < d) d.setMonth(d.getMonth() - 1);
                return d;
            }
            if (type === "monthly10") {
                const d = new Date(now.getFullYear(), now.getMonth(), 10, 6, 0, 0, 0);
                if (now < d) d.setMonth(d.getMonth() - 1);
                return d;
            }
            const days = type === "biweeklyA" ? [1, 15] : [10, 25];
            let candidates = [];
            for (let off = -1; off <= 0; off++) {
                const base = new Date(now.getFullYear(), now.getMonth() + off, 1, 6, 0, 0, 0);
                days.forEach(day => candidates.push(new Date(base.getFullYear(), base.getMonth(), day, 6, 0, 0, 0)));
            }
            candidates = candidates.filter(c => c <= now).sort((a, b) => b - a);
            return candidates[0];
        };

        // リセットを跨いでいたら、該当タイプのチェックを外し、未達成項目を char.review に記録する。
        // 集計対象はキャラごとに「デフォルト12件＋そのキャラに表示されるカスタムタスク」に限定する（R1）。
        // lastResets が無い旧データは「今の期間のもの」として初期化するだけで、既存チェックは消さない（移行時のデータ消失防止）。
        // 新タイプ（monthly）の lastResets も、未初期化なら mostRecentReset を初期値として入れるだけでチェックは消さない（R2）。
        const processResets = (inputData, now) => {
            const data = JSON.parse(JSON.stringify(inputData));
            normalizeCustomData(data);
            const autoTypes = getAutoResetTypes(data);
            if (!data.lastResets || typeof data.lastResets !== "object") {
                data.lastResets = {};
                autoTypes.forEach(type => { data.lastResets[type] = mostRecentReset(type, now).getTime(); });
                data.lastCheck = now.getTime();
                return { data: data, changed: true, resetTypes: [], migrated: true };
            }
            // 未初期化のタイプ（monthly 追加時など）は初期化のみ行い、その回のリセット判定には入れない。
            // 初期化したら changed=true を返し、呼び出し側に保存させる（開きっぱなしで境界を跨いでもリセット判定できるように）
            let initializedNewType = false;
            autoTypes.forEach(type => {
                if (data.lastResets[type] === undefined) {
                    data.lastResets[type] = mostRecentReset(type, now).getTime();
                    initializedNewType = true;
                }
            });
            let resetTypes = [];
            autoTypes.forEach(type => {
                const mr = mostRecentReset(type, now).getTime();
                const prev = data.lastResets[type] || 0;
                if (mr > prev) {
                    resetTypes.push(type);
                    data.characters.forEach(char => {
                        const group = visibleTasksFor(data, char).filter(task => task.type === type);
                        if (!char.tasks) char.tasks = {};
                        const missed = group.filter(task => !char.tasks[task.id]);
                        const done = group.filter(task => !!char.tasks[task.id]);
                        const prevReview = char.review || null;
                        let items = (prevReview && prevReview.items) ? prevReview.items.filter(i => i.type !== type) : [];
                        items = items.concat(missed.map(task => ({ id: task.id, name: task.name, type: type })));
                        let doneByType = (prevReview && prevReview.doneByType) ? Object.assign({}, prevReview.doneByType) : {};
                        let totalByType = (prevReview && prevReview.totalByType) ? Object.assign({}, prevReview.totalByType) : {};
                        doneByType[type] = done.length;
                        totalByType[type] = group.length;
                        char.review = { at: mr, items: items, doneByType: doneByType, totalByType: totalByType };
                        char.uncompleted = items;
                        group.forEach(task => { delete char.tasks[task.id]; });
                    });
                    data.lastResets[type] = mr;
                }
            });
            if (resetTypes.length > 0) data.lastCheck = now.getTime();
            return { data: data, changed: resetTypes.length > 0 || initializedNewType, resetTypes: resetTypes, migrated: false };
        };

        // 名称が修正されたアクセの、保存済み完成チェックを引き継ぐための移行
        const ACC_RENAMES = [["神罰のゆびわ", "神智のゆびわ"], ["まもののこころ結晶", "まもののこころの結晶"], ["エステラ / ハクオウ / ユーライザのこころ", "異界のなかまのこころ（全17人）"]];
        const migrateAccNames = (dataObj) => {
            if (!dataObj || !dataObj.characters) return dataObj;
            dataObj.characters.forEach(c => {
                if (!c.accs) return;
                ACC_RENAMES.forEach(([oldName, newName]) => {
                    if (c.accs[oldName]) { c.accs[newName] = c.accs[oldName]; delete c.accs[oldName]; }
                });
            });
            return dataObj;
        };

        // ▼ お知らせ・更新履歴（新しい順に並べる） ▼
        const CHANGELOG = [
            {
                date: "2026年11月23日",
                items: [
                    "天獄の初回報酬に『覚醒の鬼石』を追記しました"
                ]
            },
            {
                date: "2026年11月22日",
                items: [
                    "カスタマイズ機能を追加しました。好きな周期コンテンツを15種のライブラリや自由入力で追加でき、キャラごとに表示を設定できます",
                    "コンテンツの一括追加・一括削除に対応しました",
                    "レイアウトを全画面化し、空白ができないよう配置を自動で最適化するようにしました",
                    "テンの日を『月課（毎月10日6時更新）』として追加しました",
                    "アクセサリー情報を更新しました（まもののこころの結晶2、ガナサダイのこころを追加／異界のなかまのこころ（全17人）に改名）",
                    "強戦士の書にVer8.1の連戦仕様を追記しました",
                    "データ保存に関するご注意を追加しました。ブラウザのサイトデータを消すとデータも消えてしまうので、こまめなバックアップをお願いします"
                ]
            },
            {
                date: "2026年11月19日",
                items: [
                    "トップに配信お知らせバーを追加しました。開発者がYouTubeで配信中のときにお知らせします"
                ]
            },
            {
                date: "2026年11月18日",
                items: [
                    "ドラクエ10ナビゲーションを公開しました"
                ]
            }
        ];

        const App = () => {
            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);
            
            const [activeCharId, setActiveCharId] = useState(0);
            const [timeNav, setTimeNav] = useState({ daily: "", weekly: "", biweeklyA: "", biweeklyB: "", monthly: "", monthly10: "" });
            const [modalInfo, setModalInfo] = useState(null);
            const [taskModalInfo, setTaskModalInfo] = useState(null);
            const [editingName, setEditingName] = useState(false);
            const [tempName, setTempName] = useState("");
            const [showCustomPanel, setShowCustomPanel] = useState(false);
            const [showChangelog, setShowChangelog] = useState(false);
            const [scopeTarget, setScopeTarget] = useState(null); // 反映範囲ダイアログ: { defId, mode: "active"|"all"|"select", selected: {charId: true} }
            const [newTaskName, setNewTaskName] = useState("");
            const [newTaskType, setNewTaskType] = useState("weekly");

            // ▼ セクション配置の最適化（メイソンリー）用 ▼
            const [columnCount, setColumnCount] = useState(() => sectionColumnCountForWidth(window.innerWidth));
            const [measuredLayout, setMeasuredLayout] = useState(null); // { sig, columns } 実測ベースの配置
            const [layoutTick, setLayoutTick] = useState(0); // リサイズ後の再実測トリガー（値自体は使わない）
            const sectionCardRefs = useRef({}); // type -> セクションカードの DOM
            const layoutInfoRef = useRef({ groups: [], columnCount: 1, sig: "" }); // 最新の表示セクションと列数

            // リサイズで列数を更新する。同じ列数でも折り返しで高さが変わり得るため、再実測も促す。
            useEffect(() => {
                let timer = null;
                const onResize = () => {
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(() => {
                        setColumnCount(sectionColumnCountForWidth(window.innerWidth));
                        setLayoutTick(t => t + 1);
                    }, 150);
                };
                window.addEventListener("resize", onResize);
                const t0 = setTimeout(() => setLayoutTick(t => t + 1), 600); // 初期表示のフォント・スタイル確定後に再実測
                return () => { window.removeEventListener("resize", onResize); if (timer) clearTimeout(timer); clearTimeout(t0); };
            }, []);

            // 描画後に各セクションカードの高さを実測し、配置が変わる場合だけ差し替える（無限ループ防止）。
            // カード幅は列間で同一なので、再配置しても高さは変わらず配置は収束する。
            useLayoutEffect(() => {
                const info = layoutInfoRef.current;
                if (!info.groups || info.groups.length === 0) return;
                const items = [];
                for (const g of info.groups) {
                    const el = sectionCardRefs.current[g.type];
                    if (!el) return;
                    items.push({ type: g.type, height: el.offsetHeight + 24 }); // 24 = カード下マージン mb-6
                }
                const cols = distributeSections(items, info.columnCount);
                setMeasuredLayout(prev => {
                    if (prev && prev.sig === info.sig && JSON.stringify(prev.columns) === JSON.stringify(cols)) return prev;
                    return { sig: info.sig, columns: cols };
                });
            });

            useEffect(() => {
                const saved = localStorage.getItem("dqx_app_data_v2");
                let parsed = null;
                try { parsed = saved ? JSON.parse(saved) : null; } catch (e) { parsed = null; }
                if (!parsed || !parsed.characters) {
                    parsed = {
                        characters: [{ id: 0, name: "メインキャラ", tasks: {}, accs: {}, uncompleted: [], review: null }],
                        lastCheck: new Date().getTime()
                    };
                }
                parsed.characters.forEach(c => {
                    if (!c.tasks) c.tasks = {};
                    if (!c.accs) c.accs = {};
                    if (!c.uncompleted) c.uncompleted = [];
                    if (c.review === undefined) c.review = null;
                });
                // 読み込み時点でリセットを跨いでいたら自動リセット＋振り返りを記録（旧データは移行初期化のみ）
                const result = processResets(migrateAccNames(normalizeCustomData(parsed)), new Date());
                pushHistory(result.data);
                updateCountdowns();

                const timer = setInterval(() => { updateCountdowns(); checkResets(); }, 1000);
                return () => clearInterval(timer);
            }, []);

            const data = history[historyIndex] || null;

            const dataRef = useRef(null);
            const indexRef = useRef(-1);
            dataRef.current = data;
            indexRef.current = historyIndex;

            // 自動リセット専用の書き換え（Undo履歴に積まない＝戻るでリセットが巻き戻らない）
            const replaceCurrentData = (newData) => {
                setHistory(prev => {
                    if (indexRef.current < 0 || indexRef.current >= prev.length) return prev;
                    const copy = [...prev];
                    copy[indexRef.current] = newData;
                    localStorage.setItem("dqx_app_data_v2", JSON.stringify(newData));
                    return copy;
                });
            };

            const checkResets = () => {
                const current = dataRef.current;
                if (!current) return;
                const result = processResets(current, new Date());
                if (result.changed) replaceCurrentData(result.data);
            };

            const dismissReview = () => {
                if (!data) return;
                const nextData = JSON.parse(JSON.stringify(data));
                const char = nextData.characters.find(c => c.id === activeCharId);
                if (char) { char.review = null; char.uncompleted = []; }
                replaceCurrentData(nextData);
            };

            const pushHistory = (newData) => {
                setHistory(prev => {
                    const newHistory = [...prev.slice(0, historyIndex + 1), newData];
                    if (newHistory.length > 30) newHistory.shift();
                    setHistoryIndex(newHistory.length - 1);
                    localStorage.setItem("dqx_app_data_v2", JSON.stringify(newData));
                    return newHistory;
                });
            };

            const undo = () => {
                if (historyIndex > 0) {
                    const newIndex = historyIndex - 1;
                    setHistoryIndex(newIndex);
                    localStorage.setItem("dqx_app_data_v2", JSON.stringify(history[newIndex]));
                }
            };

            const redo = () => {
                if (historyIndex < history.length - 1) {
                    const newIndex = historyIndex + 1;
                    setHistoryIndex(newIndex);
                    localStorage.setItem("dqx_app_data_v2", JSON.stringify(history[newIndex]));
                }
            };

            const getNextReset = (type) => {
                const now = new Date();
                let next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 0, 0);
                if (now.getTime() >= next.getTime()) next.setDate(next.getDate() + 1);

                if (type === "weekly") {
                    const diff = (7 - next.getDay()) % 7;
                    next.setDate(next.getDate() + (diff === 0 && now.getHours() < 6 ? 0 : diff));
                } else if (type === "biweeklyA") {
                    while (next.getDate() !== 1 && next.getDate() !== 15) next.setDate(next.getDate() + 1);
                } else if (type === "biweeklyB") {
                    while (next.getDate() !== 10 && next.getDate() !== 25) next.setDate(next.getDate() + 1);
                } else if (type === "monthly") {
                    next = new Date(now.getFullYear(), now.getMonth(), 1, 6, 0, 0);
                    if (now.getTime() >= next.getTime()) next.setMonth(next.getMonth() + 1);
                } else if (type === "monthly10") {
                    next = new Date(now.getFullYear(), now.getMonth(), 10, 6, 0, 0);
                    if (now.getTime() >= next.getTime()) next.setMonth(next.getMonth() + 1);
                }
                return next;
            };

            const updateCountdowns = () => {
                const now = new Date().getTime();
                const format = (target) => {
                    const diff = target.getTime() - now;
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const m = Math.floor((diff / 1000 / 60) % 60);
                    return diff > 0 ? `${d > 0 ? d + '日と' : ''}${h}時間${m}分` : "リセットされました！";
                };
                setTimeNav({
                    daily: format(getNextReset("daily")),
                    weekly: format(getNextReset("weekly")),
                    biweeklyA: format(getNextReset("biweeklyA")),
                    biweeklyB: format(getNextReset("biweeklyB")),
                    monthly: format(getNextReset("monthly")),
                    monthly10: format(getNextReset("monthly10"))
                });
            };

            const toggleTask = (taskId) => {
                const nextData = JSON.parse(JSON.stringify(data));
                const char = nextData.characters.find(c => c.id === activeCharId);
                char.tasks[taskId] = !char.tasks[taskId];
                pushHistory(nextData);
            };

            const toggleAcc = (accName) => {
                const nextData = JSON.parse(JSON.stringify(data));
                const char = nextData.characters.find(c => c.id === activeCharId);
                char.accs[accName] = !char.accs[accName];
                pushHistory(nextData);
            };

            // ▼ カスタマイズ機能 v1：ライブラリ／カスタムタスクの操作 ▼
            // 反映範囲の変更は customTasks の enabledFor だけを変え、各キャラの tasks・accs・review・uncompleted には触れない（R9・R10）。
            // OFF にしてもチェック状態は char.tasks に残り、再ONで復活する。
            const openScopeDialog = (def) => {
                const selected = {};
                data.characters.forEach(c => { selected[c.id] = isTaskEnabledFor(def, c.id, false); });
                setScopeTarget({ defId: def.id, mode: def.enabledFor === "all" ? "all" : "select", selected: selected });
            };

            const applyScope = () => {
                if (!scopeTarget) return;
                const nextData = JSON.parse(JSON.stringify(data));
                if (!Array.isArray(nextData.customTasks)) nextData.customTasks = [];
                let def = nextData.customTasks.find(d => d.id === scopeTarget.defId);
                if (!def) {
                    const lib = LIBRARY_TASKS.find(l => l.id === scopeTarget.defId);
                    if (!lib) { setScopeTarget(null); return; }
                    def = { id: lib.id, name: lib.name, type: lib.type, ver: lib.ver, place: lib.place, desc: lib.desc, origin: "library", enabledFor: [], applyToNewChars: true };
                    nextData.customTasks.push(def);
                }
                if (scopeTarget.mode === "all") {
                    def.enabledFor = "all";
                    def.applyToNewChars = true;
                } else if (scopeTarget.mode === "active") {
                    const ids = Array.isArray(def.enabledFor) ? def.enabledFor.slice() : [];
                    if (ids.indexOf(activeCharId) < 0) ids.push(activeCharId);
                    def.enabledFor = ids;
                    def.applyToNewChars = false;
                } else {
                    def.enabledFor = nextData.characters.filter(c => scopeTarget.selected[c.id]).map(c => c.id);
                    def.applyToNewChars = false;
                }
                // 表示対象が誰もいなくなったライブラリ項目は、定義ごと取り除く（完全なOFF）
                if (def.origin === "library" && Array.isArray(def.enabledFor) && def.enabledFor.length === 0) {
                    nextData.customTasks = nextData.customTasks.filter(d => d.id !== def.id);
                }
                pushHistory(nextData);
                setScopeTarget(null);
            };

            // ▼ カスタマイズ機能：一括追加・一括削除（反映範囲ダイアログを bulk 種別で共用する） ▼
            const openBulkAddDialog = () => {
                const selected = {};
                data.characters.forEach(c => { selected[c.id] = false; });
                setScopeTarget({ bulk: "add", mode: "active", selected: selected });
            };

            const openBulkRemoveDialog = () => {
                const selected = {};
                data.characters.forEach(c => { selected[c.id] = false; });
                setScopeTarget({ bulk: "remove", mode: "active", selected: selected });
            };

            // 一括操作は pushHistory を1回だけ呼ぶ（Undo 1回で一括操作全体を戻せる）。
            // 一括削除は実行前に、対象件数入りの window.confirm を出す。
            const applyBulkScope = () => {
                if (!scopeTarget || !scopeTarget.bulk) return;
                const selectedIds = data.characters.filter(c => scopeTarget.selected[c.id]).map(c => c.id);
                if (scopeTarget.bulk === "add") {
                    pushHistory(bulkAddLibrary(data, scopeTarget.mode, activeCharId, selectedIds));
                    setScopeTarget(null);
                    return;
                }
                const mode = scopeTarget.mode;
                const defs = data.customTasks || [];
                let count, msg;
                if (mode === "all") {
                    count = defs.length;
                    msg = `追加コンテンツ全 ${count} 件を、全キャラから完全に削除しますか？（振り返り記録からも消えます）`;
                } else {
                    const targets = mode === "active" ? [activeCharId] : selectedIds;
                    count = defs.filter(def => targets.some(id => isTaskEnabledFor(def, id, false))).length;
                    msg = `追加コンテンツ ${count} 件を${mode === "active" ? `「${activeChar.name}」` : "選択したキャラ"}から外しますか？（チェック状態は残ります）`;
                }
                if (count === 0) { setScopeTarget(null); return; }
                if (!window.confirm(msg)) return;
                pushHistory(bulkRemoveContent(data, mode, activeCharId, selectedIds));
                setScopeTarget(null);
            };

            const turnOffTask = (defId) => {
                const nextData = JSON.parse(JSON.stringify(data));
                if (!Array.isArray(nextData.customTasks)) nextData.customTasks = [];
                const def = nextData.customTasks.find(d => d.id === defId);
                if (!def) return;
                if (def.enabledFor === "all") {
                    def.enabledFor = nextData.characters.filter(c => c.id !== activeCharId).map(c => c.id);
                    def.applyToNewChars = false;
                } else if (Array.isArray(def.enabledFor)) {
                    def.enabledFor = def.enabledFor.filter(id => id !== activeCharId);
                }
                if (def.origin === "library" && Array.isArray(def.enabledFor) && def.enabledFor.length === 0) {
                    nextData.customTasks = nextData.customTasks.filter(d => d.id !== def.id);
                }
                pushHistory(nextData);
            };

            const deleteCustomTask = (def) => {
                if (!window.confirm(`「${def.name}」を削除しますか？（全キャラの振り返り記録からも消えます）`)) return;
                const nextData = JSON.parse(JSON.stringify(data));
                nextData.customTasks = (nextData.customTasks || []).filter(d => d.id !== def.id);
                // 削除したタスクは全キャラの振り返り・未達成リストからも除去する（Q4決定）。char.tasks の孤児キーは残してよい
                nextData.characters.forEach(c => {
                    if (c.review && Array.isArray(c.review.items)) {
                        c.review = Object.assign({}, c.review, { items: c.review.items.filter(i => i.id !== def.id) });
                    }
                    if (Array.isArray(c.uncompleted)) c.uncompleted = c.uncompleted.filter(i => i.id !== def.id);
                });
                pushHistory(nextData);
            };

            const addCustomTask = () => {
                const name = newTaskName.trim();
                if (!name) { alert("タスク名を入力してください。"); return; }
                const customs = (data.customTasks || []).filter(d => d.origin === "custom");
                if (customs.length >= CUSTOM_TASK_LIMIT) { alert(`自由入力のカスタムタスクは最大${CUSTOM_TASK_LIMIT}件までです。`); return; }
                const nextData = JSON.parse(JSON.stringify(data));
                if (!Array.isArray(nextData.customTasks)) nextData.customTasks = [];
                const id = "custom-" + Date.now() + "-" + Math.floor(Math.random() * 1000000000);
                nextData.customTasks.push({ id: id, name: name, type: newTaskType, ver: "—", place: "自由入力のカスタムタスク", desc: "自分で追加したカスタムタスクです。", origin: "custom", enabledFor: [activeCharId], applyToNewChars: false });
                pushHistory(nextData);
                setNewTaskName("");
            };

            const addCharacter = () => {
                if (data.characters.length >= 100) return;
                const nextData = JSON.parse(JSON.stringify(data));
                const newId = Math.max(0, ...nextData.characters.map(c => c.id)) + 1;
                nextData.characters.push({ id: newId, name: `キャラ ${newId + 1}`, tasks: {}, accs: {}, uncompleted: [], review: null });
                pushHistory(nextData);
                setActiveCharId(newId);
            };

            const saveCharacterName = () => {
                if (!tempName.trim()) { setEditingName(false); return; }
                const nextData = JSON.parse(JSON.stringify(data));
                const char = nextData.characters.find(c => c.id === activeCharId);
                char.name = tempName;
                pushHistory(nextData);
                setEditingName(false);
            };

            const deleteCharacter = () => {
                if (data.characters.length <= 1) {
                    alert("最低でも1人のキャラクターが必要です。");
                    return;
                }
                if (!window.confirm("本当にこのキャラクターを削除しますか？")) return;
                
                const nextData = JSON.parse(JSON.stringify(data));
                nextData.characters = nextData.characters.filter(c => c.id !== activeCharId);
                // 削除したキャラのIDを、カスタムタスクの反映範囲（enabledFor）からも除去する
                if (Array.isArray(nextData.customTasks)) {
                    nextData.customTasks.forEach(def => {
                        if (Array.isArray(def.enabledFor)) def.enabledFor = def.enabledFor.filter(id => id !== activeCharId);
                    });
                }
                pushHistory(nextData);
                setActiveCharId(nextData.characters[0].id);
            };

            const handleBackup = () => {
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ドラクエ10初心者ナビバックアップ.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (parsed.characters) {
                            parsed.characters.forEach(c => {
                                if (!c.tasks) c.tasks = {};
                                if (!c.accs) c.accs = {};
                                if (!c.uncompleted) c.uncompleted = [];
                                if (c.review === undefined) c.review = null;
                            });
                            const result = processResets(migrateAccNames(normalizeCustomData(parsed)), new Date());
                            pushHistory(result.data);
                            setActiveCharId(parsed.characters[0].id);
                            alert("データを復元しました！");
                        }
                    } catch (e) {
                        alert("ファイルの読み込みに失敗しました。");
                    }
                };
                reader.readAsText(file);
            };

            if (!data) return <div className="flex justify-center items-center h-screen text-pink-500 font-bold">読み込み中...</div>;
            const activeChar = data.characters.find(c => c.id === activeCharId) || data.characters[0];
            const review = activeChar.review || null;
            const reviewDone = (review && review.doneByType) ? Object.values(review.doneByType).reduce((a, b) => a + b, 0) : 0;
            const reviewTotal = (review && review.totalByType) ? Object.values(review.totalByType).reduce((a, b) => a + b, 0) : 0;
            const otherReviewChars = data.characters.filter(c => c.id !== activeChar.id && c.review);
            const visibleTasks = visibleTasksFor(data, activeChar);
            const customCount = (data.customTasks || []).filter(d => d.origin === "custom").length;
            const libraryCount = (data.customTasks || []).filter(d => d.origin === "library").length;
            const totalAddedCount = (data.customTasks || []).length;
            const reviewTypes = CUSTOM_TASK_TYPES.filter(t => review && ((review.items && review.items.some(i => i.type === t)) || (review.doneByType && review.doneByType[t] !== undefined)));

            // ▼ タスクセクションの配置（高さ実測で空白を最小化するメイソンリー配置） ▼
            const SECTION_DEFS = [
                { title: "日課", type: "daily", time: timeNav.daily, color: "text-blue-600" },
                { title: "週課 (日曜6時更新)", type: "weekly", time: timeNav.weekly, color: "text-purple-600" },
                { title: "隔週 (1日・15日更新)", type: "biweeklyA", time: timeNav.biweeklyA, color: "text-pink-600" },
                { title: "隔週 (10日・25日更新)", type: "biweeklyB", time: timeNav.biweeklyB, color: "text-orange-600" },
                { title: "月課 (毎月1日6時更新)", type: "monthly", time: timeNav.monthly, color: "text-teal-600" },
                { title: "月課 (毎月10日6時更新)", type: "monthly10", time: timeNav.monthly10, color: "text-teal-600" },
                { title: "不定期 (手動チェック)", type: "manual", time: null, color: "text-gray-600" }
            ];
            const sectionGroups = SECTION_DEFS.filter(group => group.type === "daily" || group.type === "weekly" || group.type === "biweeklyA" || group.type === "biweeklyB" || visibleTasks.some(t => t.type === group.type));
            const sectionSig = columnCount + ":" + sectionGroups.map(g => g.type).join(",");
            const estimateSectionHeight = (type) => 116 + visibleTasks.filter(t => t.type === type).length * 52 + 24; // ヘッダー等＋行高×件数＋下マージンの目安
            const estimatedColumns = distributeSections(sectionGroups.map(g => ({ type: g.type, height: estimateSectionHeight(g.type) })), columnCount);
            const activeColumns = (measuredLayout && measuredLayout.sig === sectionSig) ? measuredLayout.columns : estimatedColumns;
            layoutInfoRef.current = { groups: sectionGroups, columnCount: columnCount, sig: sectionSig };

            const renderSectionCard = (group) => {
                const groupTasks = visibleTasks.filter(t => t.type === group.type);
                const uncompletedCount = groupTasks.filter(t => !activeChar.tasks[t.id]).length;
                return (
                    <div key={group.type} ref={el => { sectionCardRefs.current[group.type] = el; }} className="glass p-5 rounded-xl mb-6">
                        <div className="flex justify-between items-end mb-4 border-b pb-2">
                            <h2 className={`text-xl font-bold ${group.color}`}>{group.title}</h2>
                            <div className="text-right">
                                {group.time !== null && (<div className="text-xs text-gray-500">リセットまで: <span className="font-bold text-red-500">{group.time}</span></div>)}
                                <div className="text-sm font-bold mt-1">未達成: <span className="text-red-600 text-lg">{uncompletedCount}</span> 件</div>
                            </div>
                        </div>
                        <ul className="space-y-3">
                            {groupTasks.map(task => (
                                <li key={task.id} className={`flex items-center gap-3 p-2 rounded transition-colors ${activeChar.tasks[task.id] ? 'bg-gray-100/50 opacity-60' : 'hover:bg-white'}`}>
                                    <input type="checkbox" className="w-5 h-5 accent-pink-500 cursor-pointer"
                                        checked={!!activeChar.tasks[task.id]} onChange={() => toggleTask(task.id)} />
                                    <span className={`flex-1 cursor-pointer hover:text-blue-600 ${activeChar.tasks[task.id] ? 'text-gray-500 line-through' : 'font-bold text-gray-700'}`}
                                          onClick={() => setTaskModalInfo(task)} title="クリックしてやり方を見る">
                                        {task.name} <span className="text-xs text-blue-400 bg-blue-50 rounded-full w-4 h-4 inline-flex items-center justify-center font-bold ml-1">i</span>
                                    </span>
                                    <span className="text-xs bg-white border text-gray-500 px-2 py-1 rounded-full shadow-sm font-mono">Ver {task.ver}</span>
                                </li>
                            ))}
                        </ul>
                    </div>
                );
            };

            return (
                <div className="w-full max-w-[2000px] mx-auto px-3 sm:px-5 xl:px-8 pt-4 pb-20">
                    {/* ヘッダーエリア */}
                    <header className="glass p-5 rounded-xl mb-6 flex flex-col lg:flex-row justify-between items-center gap-4">
                        <div className="flex flex-col items-center lg:items-start">
                            <h1 className="text-2xl font-bold text-blue-600">
                                ドラクエ10ナビゲーションby 
                                <a href="https://youtube.com/channel/UCTKAUMI3vIwCMWHQAMEygiQ?si=HrH9H6xRXh1qFau5" 
                                   target="_blank" className="text-pink-500 hover:underline ml-1 inline-flex items-center gap-1">
                                    みすとgames <span className="text-sm">▶</span>
                                </a>
                            </h1>
                            <div className="flex gap-2 mt-2">
                                <button onClick={undo} disabled={historyIndex <= 0} className={`px-3 py-1 rounded text-sm font-bold shadow ${historyIndex > 0 ? 'bg-white text-gray-700 hover:bg-gray-100' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>⟲ 戻る</button>
                                <button onClick={redo} disabled={historyIndex >= history.length - 1} className={`px-3 py-1 rounded text-sm font-bold shadow ${historyIndex < history.length - 1 ? 'bg-white text-gray-700 hover:bg-gray-100' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>⟳ 進む</button>
                            </div>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="flex items-center bg-white p-1 rounded border shadow-sm">
                                {editingName ? (
                                    <div className="flex">
                                        <input type="text" className="p-1 px-2 outline-none w-32 border-b-2 border-pink-400" 
                                            value={tempName} onChange={e => setTempName(e.target.value)} autoFocus />
                                        <button onClick={saveCharacterName} className="text-sm bg-pink-400 text-white px-2 rounded ml-1">保存</button>
                                    </div>
                                ) : (
                                    <div className="flex items-center">
                                        <select className="p-2 outline-none font-bold text-gray-700 bg-transparent cursor-pointer" 
                                            value={activeCharId} onChange={e => {setActiveCharId(Number(e.target.value)); setEditingName(false);}}>
                                            {data.characters.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                        <button onClick={() => {setTempName(activeChar.name); setEditingName(true);}} className="text-gray-400 hover:text-blue-500 px-2" title="名前を変更">✎</button>
                                        <button onClick={deleteCharacter} className="text-gray-400 hover:text-red-500 px-2 border-l" title="キャラを削除">🗑</button>
                                    </div>
                                )}
                            </div>
                            <button onClick={addCharacter} className="bg-blue-400 text-white px-3 py-2 rounded shadow hover:bg-blue-500 text-sm font-bold">＋キャラ追加</button>
                            
                            <div className="flex gap-2 lg:ml-4 border-l pl-4">
                                <button onClick={handleBackup} className="bg-emerald-400 text-white px-3 py-2 rounded shadow hover:bg-emerald-500 text-xs font-bold">保存(DL)</button>
                                <label className="bg-orange-400 text-white px-3 py-2 rounded shadow hover:bg-orange-500 cursor-pointer text-xs font-bold">
                                    読込(復元)
                                    <input type="file" className="hidden" accept=".json" onChange={handleRestore} />
                                </label>
                            </div>
                        </div>
                    </header>

                    {/* データ保存に関する注意 */}
                    <div className="bg-amber-50/80 border border-amber-300 text-amber-800 p-3 px-4 rounded-xl mb-6 text-xs leading-relaxed shadow-sm">
                        ⚠️ <span className="font-bold">データ保存についてのご注意</span>：進捗データはこのブラウザ内にのみ保存されます。ブラウザの履歴・サイトデータを削除すると進捗も消えてしまいます。右上の「保存（DL）」ボタンで、こまめなバックアップをお願いします。
                    </div>

                    {/* お知らせ・更新履歴 */}
                    <div className="glass p-5 rounded-xl mb-6">
                        <div className="flex justify-between items-center border-b pb-2 mb-3">
                            <h2 className="text-xl font-bold text-rose-600">📢 お知らせ・更新履歴</h2>
                            <div className="flex items-center gap-3">
                                <span className="text-xs text-gray-500">最新：{CHANGELOG[0].date}</span>
                                <button onClick={() => setShowChangelog(!showChangelog)} className="bg-rose-400 text-white px-3 py-1 rounded shadow hover:bg-rose-500 text-sm font-bold">{showChangelog ? "閉じる" : "開く"}</button>
                            </div>
                        </div>
                        {showChangelog && (
                            <div className="space-y-4">
                                {CHANGELOG.map(entry => (
                                    <div key={entry.date}>
                                        <p className="text-sm font-bold text-gray-700 mb-1">{entry.date}</p>
                                        <ul className="list-disc list-inside space-y-1">
                                            {entry.items.map((item, i) => (
                                                <li key={i} className="text-sm text-gray-600">{item}</li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 振り返りナビ（自動リセット時に未達成だった項目をお知らせ） */}
                    {review && (
                        <div className="glass p-5 rounded-xl mb-6 border-2 border-amber-300" style={{background: "rgba(255, 251, 235, 0.85)"}}>
                            <div className="flex justify-between items-start gap-3 mb-2">
                                <h2 className="text-xl font-bold text-amber-600">🔔 振り返りナビ</h2>
                                <button onClick={dismissReview} className="bg-amber-400 text-white px-3 py-1 rounded shadow hover:bg-amber-500 text-sm font-bold shrink-0">確認した</button>
                            </div>
                            <p className="text-sm text-gray-700 font-bold mb-3">
                                {new Date(review.at).getMonth() + 1}月{new Date(review.at).getDate()}日 6:00 のリセットを迎えました。
                                前の期間は {reviewTotal} 件中 <span className="text-blue-600">{reviewDone} 件達成</span>でした。おつかれさま！
                            </p>
                            {review.items && review.items.length > 0 ? (
                                <div className="space-y-2">
                                    <p className="text-sm font-bold text-red-500">未達成だった項目はこちらです（次の期間でがんばろう！）</p>
                                    {reviewTypes.map(type => {
                                        const items = review.items.filter(i => i.type === type);
                                        if (items.length === 0) return null;
                                        return (
                                            <div key={type} className="bg-white/70 rounded-lg p-3 border border-amber-100">
                                                <span className="text-xs font-bold bg-amber-500 text-white px-2 py-1 rounded shadow-sm mr-2">{TYPE_LABELS[type]}</span>
                                                <span className="text-sm font-bold text-gray-700">{items.map(i => i.name).join("、")}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <p className="text-sm font-bold text-emerald-600 bg-emerald-50 rounded-lg p-3 border border-emerald-100">🎉 リセット対象は全部達成できていました！すごい！</p>
                            )}
                            {otherReviewChars.length > 0 && (
                                <p className="text-xs text-gray-500 mt-3">ほかのキャラ（{otherReviewChars.map(c => c.name).join("、")}）にも振り返りがあります。キャラを切り替えて確認してね。</p>
                            )}
                        </div>
                    )}

                    {/* タスクセクション（高さ実測で配置を最適化するメイソンリー配置） */}
                    <div className="flex gap-6 mb-8 items-start">
                        {activeColumns.map((colTypes, ci) => (
                            <div key={ci} className="flex-1 min-w-0 flex flex-col">
                                {colTypes.map(type => {
                                    const group = sectionGroups.find(g => g.type === type);
                                    return group ? renderSectionCard(group) : null;
                                })}
                            </div>
                        ))}
                    </div>

                    {/* カスタマイズ（追加コンテンツ＆自由入力タスク） */}
                    <div className="glass p-5 rounded-xl mb-8">
                        <div className="flex justify-between items-center border-b pb-2 mb-3">
                            <h2 className="text-xl font-bold text-indigo-600">🧩 カスタマイズ（追加コンテンツ）</h2>
                            <button onClick={() => setShowCustomPanel(!showCustomPanel)} className="bg-indigo-400 text-white px-3 py-1 rounded shadow hover:bg-indigo-500 text-sm font-bold">{showCustomPanel ? "閉じる" : "開く"}</button>
                        </div>
                        {showCustomPanel && (
                            <div>
                                <p className="text-xs text-gray-500 mb-4">デフォルトの12件は全キャラに常時表示されます。ここで追加したコンテンツは、選んだキャラにだけ表示されます。チェック状態はキャラごとに別々に記録されます。</p>

                                <div className="bg-indigo-50/70 border border-indigo-100 rounded-lg p-3 mb-6">
                                    <h3 className="font-bold text-gray-700 mb-1">🔁 一括操作</h3>
                                    <p className="text-xs text-gray-500 mb-2">現在の追加状況：ライブラリ追加済み {libraryCount} / {LIBRARY_TASKS.length} 件・カスタム {customCount} 件</p>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={openBulkAddDialog} className="text-sm bg-indigo-400 text-white px-3 py-2 rounded shadow font-bold hover:bg-indigo-500">ライブラリを一括追加</button>
                                        <button onClick={openBulkRemoveDialog} disabled={totalAddedCount === 0} className={`text-sm px-3 py-2 rounded shadow font-bold ${totalAddedCount === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-red-400 text-white hover:bg-red-500'}`}>追加コンテンツを一括削除</button>
                                    </div>
                                </div>

                                <h3 className="font-bold text-gray-700 mb-2">📚 ライブラリから追加</h3>
                                <ul className="space-y-2 mb-6">
                                    {LIBRARY_TASKS.map(lib => {
                                        const def = (data.customTasks || []).find(d => d.id === lib.id) || null;
                                        const on = def ? isTaskEnabledFor(def, activeChar.id, false) : false;
                                        return (
                                            <li key={lib.id} className="flex flex-wrap items-center gap-2 bg-white/60 rounded-lg p-2 border border-indigo-100">
                                                <span className="text-xs font-bold bg-indigo-400 text-white px-2 py-0.5 rounded">{TYPE_LABELS[lib.type]}</span>
                                                <span className="font-bold text-gray-700 flex-1 cursor-pointer hover:text-blue-600" onClick={() => setTaskModalInfo(lib)} title="クリックしてやり方を見る">{lib.name}</span>
                                                {on ? (
                                                    <span className="flex gap-1">
                                                        <button onClick={() => openScopeDialog(def)} className="text-xs bg-white border border-indigo-300 text-indigo-600 px-2 py-1 rounded shadow-sm font-bold">反映範囲を変更</button>
                                                        <button onClick={() => turnOffTask(lib.id)} className="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded shadow-sm font-bold">このキャラでOFF</button>
                                                    </span>
                                                ) : (
                                                    <button onClick={() => openScopeDialog(def || lib)} className="text-xs bg-indigo-400 text-white px-3 py-1 rounded shadow font-bold">追加する</button>
                                                )}
                                            </li>
                                        );
                                    })}
                                </ul>

                                <h3 className="font-bold text-gray-700 mb-2">✏️ 自由入力のカスタムタスク（{customCount} / {CUSTOM_TASK_LIMIT} 件）</h3>
                                <div className="flex flex-wrap gap-2 mb-3">
                                    <input type="text" className="p-2 border rounded flex-1 bg-white/80" style={{minWidth: "180px"}} placeholder="タスク名（例：おでかけすごろく）" value={newTaskName} onChange={e => setNewTaskName(e.target.value)} disabled={customCount >= CUSTOM_TASK_LIMIT} />
                                    <select className="p-2 border rounded bg-white/80" value={newTaskType} onChange={e => setNewTaskType(e.target.value)} disabled={customCount >= CUSTOM_TASK_LIMIT}>
                                        {CUSTOM_TASK_TYPES.map(t => <option key={t} value={t}>{TYPE_LABELS[t]}</option>)}
                                    </select>
                                    <button onClick={addCustomTask} disabled={customCount >= CUSTOM_TASK_LIMIT} className={`px-3 py-2 rounded shadow text-sm font-bold ${customCount >= CUSTOM_TASK_LIMIT ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-pink-400 text-white hover:bg-pink-500'}`}>追加</button>
                                </div>
                                {customCount >= CUSTOM_TASK_LIMIT && (
                                    <p className="text-xs text-red-500 font-bold mb-3">上限（{CUSTOM_TASK_LIMIT}件）に達したため、これ以上追加できません。不要なカスタムタスクを削除してください。</p>
                                )}
                                <ul className="space-y-2">
                                    {(data.customTasks || []).filter(d => d.origin === "custom").map(def => {
                                        const on = isTaskEnabledFor(def, activeChar.id, false);
                                        return (
                                            <li key={def.id} className="flex flex-wrap items-center gap-2 bg-white/60 rounded-lg p-2 border border-pink-100">
                                                <span className="text-xs font-bold bg-pink-400 text-white px-2 py-0.5 rounded">{TYPE_LABELS[def.type]}</span>
                                                <span className="font-bold text-gray-700 flex-1">{def.name}</span>
                                                {on ? (
                                                    <span className="flex gap-1">
                                                        <button onClick={() => openScopeDialog(def)} className="text-xs bg-white border border-pink-300 text-pink-600 px-2 py-1 rounded shadow-sm font-bold">反映範囲を変更</button>
                                                        <button onClick={() => turnOffTask(def.id)} className="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded shadow-sm font-bold">このキャラでOFF</button>
                                                    </span>
                                                ) : (
                                                    <button onClick={() => openScopeDialog(def)} className="text-xs bg-pink-400 text-white px-3 py-1 rounded shadow font-bold">追加する</button>
                                                )}
                                                <button onClick={() => deleteCustomTask(def)} className="text-xs bg-red-100 text-red-500 px-2 py-1 rounded shadow-sm font-bold">削除</button>
                                            </li>
                                        );
                                    })}
                                </ul>
                            </div>
                        )}
                    </div>

                    {/* アクセサリー伝承ツリー */}
                    <div className="glass p-6 rounded-xl">
                        <h2 className="text-2xl font-bold text-blue-600 mb-6">👑 アクセサリー伝承ツリー＆完成チェック</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
                            {accTrees.map(tree => (
                                <div key={tree.part} className="border p-4 rounded-lg bg-white bg-opacity-60 shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-2 h-full bg-pink-300"></div>
                                    <h3 className="font-bold text-pink-600 border-b border-pink-200 mb-4 pb-1 pl-3 text-lg">【{tree.part}】アクセ</h3>
                                    {tree.routes.map((route, i) => (
                                        <div key={i} className="flex flex-wrap items-center text-sm mb-4 pl-3">
                                            {route.map((acc, j) => (
                                                <span key={acc} className="acc-arrow flex items-center mb-1">
                                                    <input type="checkbox" className="mr-1 w-4 h-4 accent-yellow-400 cursor-pointer"
                                                        title="完成チェック" checked={!!activeChar.accs[acc]} onChange={() => toggleAcc(acc)} />
                                                    <span className="text-blue-600 underline cursor-pointer hover:text-blue-800 flex items-center gap-1 font-medium"
                                                          onClick={() => setModalInfo({ name: acc, ...bossInfo[acc] })}>
                                                        {acc} <span className="text-xs text-blue-400 bg-blue-50 rounded-full w-4 h-4 inline-flex items-center justify-center font-bold">i</span>
                                                    </span>
                                                </span>
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>

                    <footer className="text-center text-xs text-gray-500 mt-10 leading-relaxed">
                        <p>※本ツールは非公式のファンメイドツールです。「ドラゴンクエストX」および関連する名称・情報の権利は株式会社スクウェア・エニックスに帰属します。</p>
                        <p className="mt-1">進捗データはお使いのブラウザ内にのみ保存されます。</p>
                        <p className="mt-1">ブラウザの履歴・サイトデータ（Cookie等）を削除すると、保存された進捗データも一緒に消去されます。定期的に「保存（DL）」ボタンからバックアップをお願いします。データの消失・損害について、当ツールでは一切の責任を負いかねます。あらかじめご了承ください。</p>
                    </footer>

                    {/* アクセ詳細モーダル */}
                    {modalInfo && (
                        <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50"
                             onClick={(e) => { if(e.target === e.currentTarget) setModalInfo(null); }}>
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button className="absolute top-3 right-4 text-gray-400 hover:text-red-500 font-bold text-2xl"
                                        onClick={() => setModalInfo(null)}>×</button>
                                <h3 className="text-xl font-bold text-blue-700 mb-5 border-b-2 border-blue-100 pb-3 pr-8">{modalInfo.name}</h3>
                                {modalInfo.boss ? (
                                    <div className="space-y-4">
                                        <div className="bg-red-50 p-3 rounded-lg border border-red-100">
                                            <span className="text-xs font-bold bg-red-500 text-white px-2 py-1 rounded shadow-sm mr-2 mb-1 inline-block">入手方法・対象ボス</span>
                                            <p className="text-red-700 font-bold mt-1 text-lg">{modalInfo.boss}</p>
                                        </div>
                                        <div className="bg-green-50 p-3 rounded-lg border border-green-100">
                                            <span className="text-xs font-bold bg-green-500 text-white px-2 py-1 rounded shadow-sm mr-2 mb-1 inline-block">おすすめ耐性 (付与部位)</span>
                                            <p className="mt-2 text-sm text-green-900 font-bold leading-relaxed">{modalInfo.res}</p>
                                        </div>
                                    </div>
                                ) : (
                                    <p className="text-gray-500 text-sm p-4 bg-gray-50 rounded text-center">※このアクセサリーのボス・耐性情報は現在準備中です。</p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 反映範囲ダイアログ */}
                    {scopeTarget && (() => {
                        const isBulk = !!scopeTarget.bulk;
                        const def = isBulk ? null : ((data.customTasks || []).find(d => d.id === scopeTarget.defId) || LIBRARY_TASKS.find(l => l.id === scopeTarget.defId));
                        if (!isBulk && !def) return null;
                        return (
                            <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50"
                                 onClick={(e) => { if (e.target === e.currentTarget) setScopeTarget(null); }}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                    <button className="absolute top-3 right-4 text-gray-400 hover:text-red-500 font-bold text-2xl" onClick={() => setScopeTarget(null)}>×</button>
                                    <h3 className="text-lg font-bold text-indigo-700 mb-1 pr-8">{isBulk ? (scopeTarget.bulk === "add" ? "📚 ライブラリを一括追加" : "🗑 追加コンテンツを一括削除") : `「${def.name}」の反映範囲`}</h3>
                                    <p className="text-xs text-gray-500 mb-4">{isBulk ? (scopeTarget.bulk === "add" ? `ライブラリ全${LIBRARY_TASKS.length}件を、選んだ範囲でまとめて追加します。ほかのキャラのチェック状態には影響しません。` : "追加コンテンツ（ライブラリ＋自由入力）をまとめて外します。「全キャラから完全に削除」以外では、チェック状態は残ります。") : "表示するキャラを選んでください。ほかのキャラのチェック状態には影響しません。"}</p>
                                    <div className="space-y-2 mb-4">
                                        <label className="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg p-2 cursor-pointer">
                                            <input type="radio" name="scopeMode" checked={scopeTarget.mode === "active"} onChange={() => setScopeTarget(Object.assign({}, scopeTarget, { mode: "active" }))} />
                                            <span className="text-sm font-bold text-gray-700">{isBulk && scopeTarget.bulk === "remove" ? `このキャラから外す（${activeChar.name}）` : `このキャラのみ（${activeChar.name}）`}</span>
                                        </label>
                                        <label className="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg p-2 cursor-pointer">
                                            <input type="radio" name="scopeMode" checked={scopeTarget.mode === "all"} onChange={() => setScopeTarget(Object.assign({}, scopeTarget, { mode: "all" }))} />
                                            <span className="text-sm font-bold text-gray-700">{isBulk && scopeTarget.bulk === "remove" ? "全キャラから完全に削除" : "全キャラ（新しく作るキャラにも表示）"}</span>
                                        </label>
                                        <label className="flex items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-lg p-2 cursor-pointer">
                                            <input type="radio" name="scopeMode" checked={scopeTarget.mode === "select"} onChange={() => setScopeTarget(Object.assign({}, scopeTarget, { mode: "select" }))} />
                                            <span className="text-sm font-bold text-gray-700">{isBulk && scopeTarget.bulk === "remove" ? "キャラを選択して外す" : "キャラを選択して反映"}</span>
                                        </label>
                                    </div>
                                    {scopeTarget.mode === "select" && (
                                        <div className="space-y-1 mb-4 max-h-48 overflow-y-auto border rounded-lg p-2 bg-gray-50">
                                            {data.characters.map(c => (
                                                <label key={c.id} className="flex items-center gap-2 p-1 cursor-pointer">
                                                    <input type="checkbox" className="w-4 h-4 accent-indigo-500" checked={!!scopeTarget.selected[c.id]}
                                                        onChange={() => { const sel = Object.assign({}, scopeTarget.selected); sel[c.id] = !sel[c.id]; setScopeTarget(Object.assign({}, scopeTarget, { selected: sel })); }} />
                                                    <span className="text-sm font-bold text-gray-700">{c.name}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}
                                    <div className="flex gap-2 justify-end">
                                        <button onClick={() => setScopeTarget(null)} className="px-3 py-2 rounded bg-gray-200 text-gray-600 text-sm font-bold">キャンセル</button>
                                        <button onClick={isBulk ? applyBulkScope : applyScope} className={`px-4 py-2 rounded text-white text-sm font-bold shadow ${isBulk && scopeTarget.bulk === "remove" ? 'bg-red-400 hover:bg-red-500' : 'bg-indigo-400 hover:bg-indigo-500'}`}>{isBulk ? (scopeTarget.bulk === "add" ? "一括追加する" : "一括削除する") : "反映する"}</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* タスク解説モーダル */}
                    {taskModalInfo && (
                        <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50"
                             onClick={(e) => { if(e.target === e.currentTarget) setTaskModalInfo(null); }}>
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button className="absolute top-3 right-4 text-gray-400 hover:text-red-500 font-bold text-2xl"
                                        onClick={() => setTaskModalInfo(null)}>×</button>
                                <div className="flex items-center gap-2 mb-3 border-b pb-2">
                                    <h3 className="text-xl font-bold text-purple-700">{taskModalInfo.name}</h3>
                                    <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-mono">Ver {taskModalInfo.ver}</span>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                        <span className="text-xs font-bold bg-blue-500 text-white px-2 py-1 rounded shadow-sm mr-2 mb-1 inline-block">どこで (場所・NPC)</span>
                                        <p className="text-blue-900 font-bold mt-1 text-sm">{taskModalInfo.place}</p>
                                    </div>
                                    <div className="bg-yellow-50 p-3 rounded-lg border border-yellow-100">
                                        <span className="text-xs font-bold bg-yellow-600 text-white px-2 py-1 rounded shadow-sm mr-2 mb-1 inline-block">何をすればいいか</span>
                                        <p className="mt-2 text-sm text-yellow-900 font-medium leading-relaxed">{taskModalInfo.desc}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
      // 配信のお知らせバー（×で消すと、そのお知らせについては再表示しない）
      (function () {
        var STORE_KEY = 'mist_live_banner_dismissed_navi';
        fetch('https://flat-cake-9635mist-live-check.mist12141208-ec9.workers.dev/')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d) return;
            var text, key;
            if (d.live) {
              text = d.message || '🔴 現在開発者がYouTubeでライブ配信中です！応援よろしくお願いいたします！';
              key = 'live:' + (d.videoId || '');
            } else if (d.lastLiveDate) {
              text = d.message || ('📺 開発者の最新動画は' + d.lastLiveDate + 'に公開されました！チャンネル登録をして待っててね！');
              key = 'last:' + d.lastLiveDate;
            } else {
              return;
            }
            try { if (localStorage.getItem(STORE_KEY) === key) return; } catch (e) {}
            var bar = document.getElementById('liveBanner');
            var link = document.getElementById('liveBannerLink');
            if (d.live) {
              // 配信中のみ横スクロール（テロップ）表示にする
              link.classList.add('mist-marquee');
              var track = document.createElement('span');
              track.className = 'mist-marquee-track';
              for (var i = 0; i < 2; i++) {
                var copy = document.createElement('span');
                copy.className = 'mist-marquee-copy';
                copy.textContent = text;
                track.appendChild(copy);
              }
              link.appendChild(track);
            } else {
              link.textContent = text;
            }
            link.href = d.url;
            bar.style.display = 'flex';
            document.getElementById('liveBannerClose').onclick = function () {
              bar.style.display = 'none';
              try { localStorage.setItem(STORE_KEY, key); } catch (e) {}
            };
          })
          .catch(function () {});
      })();
    </script>
</body>
</html>
